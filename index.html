<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Esha &amp; Abdulrehman | Nikkah Invitation</title>
<meta name="description" content="You are invited to the Nikkah of Esha and Abdulrehman.">
<meta property="og:title" content="Esha & Abdulrehman | Nikkah Invitation">
<meta property="og:description" content="Open your invitation.">
<meta name="theme-color" content="#f0d2c0">
<link rel="preload" as="image" href="assets/curtain.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Pinyon+Script&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf6ec; --paper2:#f5ead9; --ink:#4b3b36; --mute:#8b776c; --gold:#b48a4a; --gold2:#d9b878; --gold3:#8c6a2c;
  --sage:#8fa383; --blush:#f0d2c0;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif; --script:'Pinyon Script','Snell Roundhand',cursive; --ar:'Amiri','Traditional Arabic',serif;
  --foil:linear-gradient(105deg,#8a6420 0%,#d8b46a 22%,#e6c880 36%,#b98d42 50%,#e9cf8a 64%,#9a722c 80%,#c9a050 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.opened{overflow:auto}
.foil{background:var(--foil) 0 0/260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:foil 7s ease-in-out infinite}
@keyframes foil{0%,35%{background-position:100% 0}100%{background-position:-60% 0}}
/* paper grain + vignette over everything */
body::after{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;background:
  radial-gradient(120% 90% at 50% 45%,transparent 58%,rgba(120,80,50,.13) 100%);}
.grain{position:fixed;inset:0;z-index:41;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .34  0 0 0 0 .27  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
/* ---------- pages ---------- */
main{height:100svh;overflow-y:auto;scroll-snap-type:y proximity;scroll-behavior:smooth;pointer-events:none;overscroll-behavior:contain}
body.opened main{pointer-events:auto}
.page{position:relative;min-height:100svh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:max(46px,env(safe-area-inset-top)) 22px max(54px,env(safe-area-inset-bottom));overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,#fffaf0 0%,var(--paper) 55%,var(--paper2) 100%)}
.art{position:absolute;inset:-3%;pointer-events:none;background:url(assets/border_a.webp) center/cover no-repeat;will-change:transform}
.page.p2 .art{transform:scaleY(-1);}
.art.a2{ }
@media (min-aspect-ratio:3/4){ .art{inset:0 calc(50% - 28.125svh);background-size:100% 100%} .page{background:radial-gradient(90% 90% at 50% 40%,#fffaf0,#f2e6d2)} }
.content{position:relative;z-index:2;text-align:center;max-width:300px;width:100%;display:flex;flex-direction:column;align-items:center;gap:13px;transform-style:preserve-3d;will-change:transform;transition:transform .25s ease-out}
.reveal{opacity:0;transform:translateY(18px);transition:opacity 2s cubic-bezier(.2,.7,.2,1),transform 2s cubic-bezier(.2,.7,.2,1)}
body.opened .page.in .reveal{opacity:1;transform:none}
.page.in .reveal:nth-child(2){transition-delay:.18s}.page.in .reveal:nth-child(3){transition-delay:.36s}.page.in .reveal:nth-child(4){transition-delay:.54s}
.page.in .reveal:nth-child(5){transition-delay:.72s}.page.in .reveal:nth-child(6){transition-delay:.9s}.page.in .reveal:nth-child(7){transition-delay:1.08s}.page.in .reveal:nth-child(8){transition-delay:1.26s}.page.in .reveal:nth-child(9){transition-delay:1.44s}
.bismillah{font-family:var(--ar);font-size:23px;line-height:1.5;padding-top:2px}
.eyebrow{font-family:var(--sans);font-weight:400;font-size:9.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--mute);padding-left:.42em}
.names{font-family:var(--script);font-weight:400;font-size:clamp(44px,13.4vw,60px);line-height:1.08;filter:drop-shadow(0 1px 0 rgba(255,250,235,.8)) drop-shadow(0 2px 3px rgba(120,85,30,.18))}
.names .amp{display:block;font-family:var(--serif);font-style:italic;font-weight:300;font-size:24px;line-height:1;margin:0}
.lead{font-size:16.5px;font-style:italic;font-weight:400;color:var(--mute);line-height:1.5;letter-spacing:.01em}
.orn{display:block;width:150px;height:14px;overflow:visible}
.date{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:.05em;line-height:1.25}
.small{font-family:var(--sans);font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);line-height:1.8;padding-left:.3em}
.countdown{display:flex;gap:8px;margin-top:2px}
.countdown div{display:flex;flex-direction:column;align-items:center;width:58px;padding:9px 0 7px;border:1px solid rgba(180,138,74,.55);border-radius:3px;background:linear-gradient(180deg,rgba(255,252,244,.8),rgba(250,240,224,.55));box-shadow:0 8px 18px -10px rgba(110,80,40,.35),inset 0 0 0 3px rgba(255,252,244,.6),inset 0 0 0 3.5px rgba(180,138,74,.22)}
.countdown b{font-family:var(--serif);font-weight:500;font-size:27px;line-height:1.05;color:var(--ink);font-variant-numeric:tabular-nums lining-nums}
.countdown span{font-family:var(--sans);font-size:7.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);padding-left:.26em;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:var(--sans);font-size:10px;font-weight:500;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;color:#fbf3e4;background:linear-gradient(180deg,#665149,#43342f);padding:14px 22px 14px 25px;border-radius:2px;border:1px solid #2f2420;cursor:pointer;box-shadow:0 10px 22px -8px rgba(60,40,30,.55),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .2s}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,252,244,.55);color:var(--ink);border:1px solid var(--gold);box-shadow:none}
.scrollhint{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;font-family:var(--sans);font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:5px;animation:bob 2.4s ease-in-out infinite;white-space:nowrap;text-shadow:0 0 8px #fbf6ec,0 0 4px #fbf6ec}
.scrollhint svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:1.1}
@keyframes bob{50%{transform:translate(-50%,5px)}}
h2.title{font-family:var(--serif);font-weight:300;font-style:italic;font-size:38px;line-height:1.05}
.venue-name{font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.15;letter-spacing:.02em}
.addr{font-size:15px;color:var(--mute);line-height:1.45;font-style:italic}
.map{width:100%;aspect-ratio:16/9.5;position:relative;overflow:hidden;border-radius:3px;border:1px solid var(--gold2);padding:0;background:#eef0e4;box-shadow:0 0 0 4px rgba(255,252,244,.75),0 0 0 4.7px rgba(180,138,74,.4),0 16px 30px -14px rgba(74,58,53,.4)}
.map>svg:first-child{width:100%;height:100%;display:block}
.map svg.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);width:28px;height:auto;filter:drop-shadow(0 6px 5px rgba(0,0,0,.25));animation:drop 1.2s cubic-bezier(.3,1.6,.5,1) both .6s}
.map .ring{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;border:1px solid rgba(180,70,60,.6);animation:ring 2.6s ease-out infinite 1.5s}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(4.5);opacity:0}}
@keyframes drop{from{transform:translate(-50%,-260%);opacity:0}}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.row[hidden]{display:none}
.info{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.info div{display:flex;flex-direction:column;align-items:center;gap:3px;border-top:1px solid rgba(180,138,74,.5);padding-top:9px}
.info svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.info b{font-family:var(--sans);font-weight:500;font-size:8.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold3);padding-left:.32em}
.info span{font-size:15.5px;line-height:1.25}
#petals{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.sw{display:none}
/* ---------- curtain intro ---------- */
#env{position:fixed;inset:0;z-index:50;cursor:pointer;overflow:hidden;background:transparent}
#env.gone{pointer-events:none}
#env .glow{display:none}
.panel{position:absolute;top:0;bottom:0;width:50.4%;overflow:hidden;z-index:2;background:#efcfbd url(assets/curtain.webp) 0 0/200% 100% no-repeat;transition:transform 5s cubic-bezier(.5,0,.2,1) .6s;will-change:transform}
.panel.l{left:0;transform-origin:0 50%;box-shadow:10px 0 34px rgba(90,50,30,.34)}
.panel.r{right:0;transform-origin:100% 50%;background-position:100% 0;box-shadow:-10px 0 34px rgba(90,50,30,.34)}
.panel .fold{position:absolute;inset:-2% -8%;pointer-events:none;opacity:.75;background:
  repeating-linear-gradient(90deg,rgba(105,55,32,.24) 0,rgba(105,55,32,0) 5%,rgba(255,243,230,.45) 9.5%,rgba(105,55,32,0) 13%,rgba(105,55,32,.2) 18%)}
.panel.r .fold{animation-delay:-3.5s}
@keyframes sway{from{transform:skewX(-.7deg) scaleX(1)}to{transform:skewX(.7deg) scaleX(1.012)}}
.panel .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(60,28,14,.34) 0,rgba(60,28,14,0) 16%,rgba(255,255,255,0) 70%,rgba(60,28,14,.22) 100%)}
.panel .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 14%,rgba(255,255,255,.16) 28%,transparent 42%,transparent 60%,rgba(255,255,255,.12) 74%,transparent 88%);animation:sheen 9s ease-in-out infinite alternate}
@keyframes sheen{from{transform:translateX(-16%)}to{transform:translateX(16%)}}
.panel .trim{position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(190,140,110,.4));box-shadow:0 0 10px rgba(120,70,40,.4)}
.panel.l .trim{right:0}.panel.r .trim{left:0}
#env.open .panel.l,#env.open .panel.r{transform:scaleX(.1)}
#env .rod{position:absolute;left:-10px;right:-10px;top:0;height:14px;z-index:6;background:linear-gradient(180deg,#f7e5ae,#b88a3a 55%,#7c5a22);box-shadow:0 6px 14px rgba(60,35,10,.35);transition:opacity 1s ease 3.4s}
#env.open .rod{opacity:0}
#env .seal{position:absolute;left:50%;top:50%;width:min(44vw,172px);aspect-ratio:1;transform:translate(-50%,-50%);z-index:7;filter:drop-shadow(0 14px 12px rgba(60,50,30,.42));animation:pulse 3s ease-in-out infinite;transition:transform .9s cubic-bezier(.5,0,.2,1),opacity .7s ease .3s}
#env .seal img{width:100%;height:100%;display:block}
#env.open .seal{transform:translate(-50%,-50%) scale(1.45) rotate(10deg);opacity:0;animation:none}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.04)}}
#env .tap{position:absolute;left:0;right:0;bottom:max(54px,env(safe-area-inset-bottom));text-align:center;z-index:7;font-family:var(--sans);font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:#5e3b2c;font-weight:500;padding-left:.4em;text-shadow:0 0 12px #f4dccb,0 0 6px #f4dccb;transition:opacity .4s;animation:fade 2.6s ease-in-out infinite}
@keyframes fade{50%{opacity:.45}}
#env.open .tap{animation:none;opacity:0}
#env .to{position:absolute;left:0;right:0;top:calc(50% + min(24vw,98px));text-align:center;z-index:7;font-family:var(--script);font-size:clamp(28px,9vw,36px);line-height:1.1;color:#5e3b2c;text-shadow:0 0 14px #f4dccb,0 0 8px #f4dccb,0 0 4px #f6e2d3,0 1px 0 rgba(255,255,255,.7);transition:opacity .5s}
#env .to small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.4em;text-transform:uppercase;color:#6e4d3d;font-weight:500;text-shadow:0 0 10px #f4dccb,0 0 5px #f4dccb;margin-bottom:6px;padding-left:.4em}
#env.open .to{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.foil{background-position:30% 0}}
@media (max-height:700px){.content{gap:9px}.names{font-size:clamp(38px,12vw,50px)}.date{font-size:21px}.bismillah{font-size:20px}.lead{font-size:15px}.page{padding-top:max(38px,env(safe-area-inset-top));padding-bottom:max(44px,env(safe-area-inset-bottom))}.map{aspect-ratio:16/8}.venue-name{font-size:22px}h2.title{font-size:32px}.countdown div{width:52px}.countdown b{font-size:23px}}
@media (max-width:340px){.info{gap:6px}.info span{font-size:13px;white-space:nowrap}.info b{letter-spacing:.22em}.page.p2 .content{gap:10px}.eyebrow{letter-spacing:.26em;font-size:9px}.date{font-size:19px;letter-spacing:.02em;white-space:nowrap}.small{letter-spacing:.2em}.bismillah{font-size:19px}.content{max-width:250px}.countdown{gap:5px}.countdown div{width:48px}.btn{padding:12px 14px;letter-spacing:.2em}.names{font-size:40px}}
</style>
</head>
<body>

<!-- ============ ENVELOPE / CURTAIN INTRO ============ -->
<div id="env" role="button" aria-label="Open invitation" tabindex="0">
  <div class="glow"></div>
  <div class="panel l"><div class="fold"></div><div class="shade"></div><div class="sheen"></div><i class="trim"></i></div>
  <div class="panel r"><div class="fold"></div><div class="shade"></div><div class="sheen"></div><i class="trim"></i></div>
  <div class="rod"></div>
  <div class="seal"><img src="assets/seal.webp" alt="" width="656" height="656"></div>
  <div class="to"><small>Together with their families</small>Esha &amp; Abdulrehman</div>
  <div class="tap">Tap to open</div>
</div>

<div class="grain"></div>
<canvas id="petals"></canvas>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gf" x1="0" x2="1"><stop offset="0" stop-color="#8a6420"/><stop offset=".5" stop-color="#e8cd88"/><stop offset="1" stop-color="#9a722c"/></linearGradient>
  <symbol id="orn" viewBox="0 0 150 14"><g fill="none" stroke="url(#gf)" stroke-width=".8" stroke-linecap="round">
    <path d="M2 7H56"/><path d="M94 7H148"/>
    <path d="M56 7c5 0 7-5 12-5M56 7c5 0 7 5 12 5M94 7c-5 0-7-5-12-5M94 7c-5 0-7 5-12 5"/>
    <path d="M75 1.5 80 7 75 12.5 70 7z" fill="url(#gf)"/></g></symbol>
</defs></svg>
<main id="main">
  <!-- ============ PAGE 1 : INVITATION ============ -->
  <section class="page p1" id="p1">
    <div class="art" data-d="1"></div>
    <div class="content">
      <div class="bismillah reveal foil">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <div class="eyebrow reveal">Together with their families</div>
      <h1 class="names reveal foil">Esha<span class="amp">&amp;</span>Abdulrehman</h1>
      <p class="lead reveal">request the honour of your presence<br>at their Nikkah ceremony</p>
      <svg class="orn reveal" aria-hidden="true"><use href="#orn"/></svg>
      <div class="date reveal" id="dateTxt"></div>
      <div class="small reveal" id="timeTxt"></div>
      <div class="countdown reveal" id="cd" aria-label="Countdown"></div>
    </div>
    <div class="scrollhint">Venue &amp; location<svg viewBox="0 0 12 12"><path d="M2 4l4 4 4-4"/></svg></div>
  </section>

  <!-- ============ PAGE 2 : VENUE & LOCATION ============ -->
  <section class="page p2" id="p2">
    <div class="art" data-d="2"></div>
    <div class="content">
      <div class="eyebrow reveal">Where we gather</div>
      <h2 class="title reveal foil">The Venue</h2>
      <h3 class="venue-name reveal" id="vName"></h3>
      <p class="addr reveal" id="vAddr"></p>
      <div class="map reveal" aria-label="Map">
        <svg viewBox="0 0 320 190" preserveAspectRatio="xMidYMid slice">
          <rect width="320" height="190" fill="#f1efe1"/>
          <path d="M0 140 C60 120 110 150 170 130 S280 112 320 126 V190 H0Z" fill="#cfe0d4" opacity=".75"/>
          <g fill="#dfe8cf"><rect x="132" y="58" width="92" height="42" rx="5"/><rect x="10" y="62" width="68" height="40" rx="5"/><rect x="262" y="118" width="50" height="62" rx="5"/><rect x="20" y="128" width="60" height="44" rx="5"/></g>
          <g stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round"><path d="M-10 54 L330 36"/><path d="M92 -10 L120 200"/><path d="M-10 112 L330 104"/><path d="M232 -10 L252 200"/></g>
          <g stroke="#e0d6bb" stroke-width="1.2" fill="none" stroke-dasharray="1 5" stroke-linecap="round"><path d="M-10 54 L330 36"/><path d="M92 -10 L120 200"/><path d="M-10 112 L330 104"/><path d="M232 -10 L252 200"/></g>
        </svg>
        <i class="ring"></i>
        <svg class="pin" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20 12 34 12 34s12-14 12-22.3C24 5.2 18.6 0 12 0z" fill="#b4463c"/><circle cx="12" cy="11.5" r="4.6" fill="#fff"/></svg>
      </div>
      <div class="info reveal">
        <div><svg viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M7 2.5v3M13 2.5v3"/></svg><b>Date</b><span id="iDate"></span></div>
        <div><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4.3l2.8 1.7"/></svg><b>Time</b><span id="iTime"></span></div>
      </div>
      <div class="row reveal">
        <a class="btn" id="mapBtn" target="_blank" rel="noopener"><svg viewBox="0 0 20 20"><path d="M10 18s6-5.6 6-10a6 6 0 0 0-12 0c0 4.4 6 10 6 10z"/><circle cx="10" cy="8" r="2.2"/></svg>Open in Maps</a>
        <button class="btn ghost" id="calBtn" type="button"><svg viewBox="0 0 20 20"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><path d="M3 8.5h14M10 11v4M8 13h4"/></svg>Add to calendar</button>
      </div>
      <div class="row reveal" id="rsvpRow" hidden><a class="btn ghost" id="rsvpBtn" target="_blank" rel="noopener">RSVP</a></div>
    </div>
  </section>
</main>

<script>
/* =====================  EDIT THESE DETAILS  ===================== */
const CONFIG = {
  bride: "Esha",
  groom: "Abdulrehman",
  dateISO: "2026-11-24T12:00:00",     // ceremony start (local time)
  endISO:  "2026-11-24T16:00:00",
  venue:   "Pine Star Farmhouse",
  address: "Pine Avenue, Green Acres Extension, T&T Aabpara Housing Society, Lahore",
  mapQuery: "Pine Star Farms, Green Acres Extension, Lahore",
  mapLink: "https://maps.app.goo.gl/rT2LsmVyEpmhjxgP8",  // exact Google Maps pin
  rsvpLink: ""                         // e.g. a WhatsApp link: https://wa.me/92XXXXXXXXXX  (leave empty to hide)
};
/* ================================================================ */

const $ = s => document.querySelector(s);
const d = new Date(CONFIG.dateISO), e = new Date(CONFIG.endISO);
const fmtDate = new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
const fmtT = x => x.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
$('#dateTxt').textContent = fmtDate;
$('#timeTxt').textContent = fmtT(d) + ' – ' + fmtT(e);
$('#vName').textContent = CONFIG.venue; $('#vAddr').textContent = CONFIG.address;
$('#iDate').textContent = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
$('#iTime').textContent = fmtT(d) + ' – ' + fmtT(e);
$('#mapBtn').href = CONFIG.mapLink || ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CONFIG.mapQuery));
if (CONFIG.rsvpLink) { $('#rsvpRow').hidden = false; $('#rsvpBtn').href = CONFIG.rsvpLink; }
$('#calBtn').onclick = () => {
  const z = x => x.toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','BEGIN:VEVENT','SUMMARY:Nikkah of ' + CONFIG.bride + ' & ' + CONFIG.groom,'DTSTART:' + z(d),'DTEND:' + z(e),'LOCATION:' + CONFIG.venue + ', ' + CONFIG.address,'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); a.download = 'nikkah.ics'; a.click();
};
/* countdown */
const cd = $('#cd');
function tick(){
  let s = Math.max(0, Math.floor((d - Date.now())/1000));
  const D = Math.floor(s/86400); s%=86400; const H = Math.floor(s/3600); s%=3600; const M = Math.floor(s/60); s%=60;
  cd.innerHTML = [[D,'Days'],[H,'Hours'],[M,'Mins'],[s,'Secs']].map(([n,l]) => `<div><b>${String(n).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
}
tick(); setInterval(tick, 1000);

/* ---- open the curtains ---- */
const env = $('#env');
function openEnv(){
  if (env.classList.contains('open')) return;
  env.classList.add('open');
  setTimeout(() => $('#p1').classList.add('in'), 100);
  setTimeout(() => document.body.classList.add('opened'), 2600);
  setTimeout(() => env.classList.add('gone'), 5800);
  setTimeout(() => env.remove(), 6200);
}
env.addEventListener('click', openEnv);
env.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') openEnv(); });

/* ---- falling petals + gold sparkles ---- */
(function(){
  const c = $('#petals'), x = c.getContext('2d'); let W, H, P = [];
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const size = () => { W = innerWidth; H = innerHeight; c.width = W*dpr; c.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener('resize', size);
  const cols = ['#ffffff','#fbe6dc','#f4cfc0','#efd9ea','#fff3dc'];
  const mk = (top) => ({x: Math.random()*W, y: top ? -20 : Math.random()*H, s: 5 + Math.random()*7, v: .35 + Math.random()*.7, sw: Math.random()*6.28, sp: .01 + Math.random()*.02, rot: Math.random()*6.28, vr: (Math.random()-.5)*.03, c: cols[Math.floor(Math.random()*cols.length)], spark: Math.random() < .3});
  for (let i = 0; i < 14; i++) P.push(mk(false));
  let last = 0;
  function frame(t){
    requestAnimationFrame(frame);
    if (document.hidden || !document.body.classList.contains('opened') || t - last < 40) return; last = t;
    x.clearRect(0,0,W,H);
    for (const p of P){
      p.y += p.v; p.sw += p.sp; p.x += Math.sin(p.sw)*.6; p.rot += p.vr;
      if (p.y > H + 20) Object.assign(p, mk(true));
      x.save(); x.translate(p.x, p.y);
      if (p.spark){ x.globalAlpha = .45 + .45*Math.sin(p.sw*3); x.fillStyle = '#d9b878'; x.beginPath(); x.arc(0,0,1.6,0,6.3); x.fill(); }
      else { x.rotate(p.rot); x.scale(1, .55 + .45*Math.sin(p.sw)); x.globalAlpha = .8; x.fillStyle = p.c; x.beginPath(); x.ellipse(0,0,p.s*.55,p.s,0,0,6.3); x.fill(); x.strokeStyle = 'rgba(200,160,140,.35)'; x.lineWidth = .5; x.stroke(); }
      x.restore();
    }
  }
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
})();

/* ---- depth: scroll parallax + pointer / gyro tilt ---- */
const main = $('#main'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx = 0, ty = 0;
let _raf = 0;
function paint(){
  _raf = 0; const h = innerHeight;
  document.querySelectorAll('.page').forEach((p, i) => {
    const off = (main.scrollTop - i*h) * .07, art = p.querySelector('.art');
    if (Math.abs(main.scrollTop - i*h) > h) return;
    const flip = p.classList.contains('p2') ? ' scaleY(-1)' : '';
    art.style.transform = `translate3d(${-tx*8}px,${off - ty*8}px,0) scale(1.03)${flip}`;
  });
}
function depth(){ if (!_raf) _raf = requestAnimationFrame(paint); }
main.addEventListener('scroll', depth, {passive: true});
if (!still){
  addEventListener('pointermove', ev => { tx = ev.clientX/innerWidth*2 - 1; ty = ev.clientY/innerHeight*2 - 1; depth(); }, {passive: true});
  addEventListener('deviceorientation', ev => { if (ev.gamma == null) return; tx = Math.max(-1, Math.min(1, ev.gamma/25)); ty = Math.max(-1, Math.min(1, (ev.beta - 50)/25)); depth(); }, {passive: true});
}
depth();

/* reveal text when a page scrolls into view */
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) x.target.classList.add('in'); }), {root: main, threshold: .4});
document.querySelectorAll('.page').forEach(p => io.observe(p));
</script>
